[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web 框架與非同步執行環境 (以 Axum 為例)
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# API 系統測試與 HTTP 請求斷言輔助庫
tower = { version = "0.4", features = ["util"] }
reqwest = { version = "0.11", features = ["json"] }